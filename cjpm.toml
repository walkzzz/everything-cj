[package]
name = "everything_cli"
version = "1.0.0"
edition = "2024"
authors = ["Cangjie Expert Team"]
license = "MIT"
description = "Everything-CJ 仓颉版搜索工具 - 毫秒级全盘文件定位"

[features]
default = ["gui", "cli", "http"]
gui = []
cli = []
http = []

[dependencies]
stdx = { version = "1.0" }
sqlite = { version = "0.1" }

[build]
output-type = "executable"
optimize = "release"
pdb = false
strip = true

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86_64"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Cangjie Expert Team"
copyright = "2026, Cangjie Expert Team"
license = "MIT"
section = "utils"
priority = "optional"

[package.metadata.rpm]
conflicts = []
provides = ["everything-cli"]
