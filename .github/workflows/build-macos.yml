name: Build macOS (GitCode)

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-aarch64
            arch: aarch64
          - runner: macos-13
            target: macos-x64
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Cangjie SDK
        run: |
          wget --no-check-certificate \
            "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225" \
            -O cangjie-sdk-mac.tar.gz
          tar -zxf cangjie-sdk-mac.tar.gz

      - name: Setup environment
        run: |
          SDK_DIR="$(pwd)/cangjie"
          echo "CANGJIE_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/tools/bin" >> $GITHUB_PATH
          echo "DYLD_LIBRARY_PATH=$SDK_DIR/runtime/lib/darwin_aarch64_cjnative:$SDK_DIR/lib/darwin_aarch64_cjnative" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          cjc --version
          cjpm --version

      - name: Build
        run: |
          cjpm build
          cp target/release/bin/main everything-cj-${{ matrix.target }}

      - name: Verify binary
        run: |
          file everything-cj-${{ matrix.target }}
          ls -lh everything-cj-${{ matrix.target }}
          ./everything-cj-${{ matrix.target }} || true

      - name: Create tarball
        run: |
          tar -czf everything-cj-v1.0.0-${{ matrix.target }}.tar.gz everything-cj-${{ matrix.target }}
          shasum -a 256 everything-cj-v1.0.0-${{ matrix.target }}.tar.gz > everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-cj-${{ matrix.target }}
          path: |
            everything-cj-${{ matrix.target }}
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256
