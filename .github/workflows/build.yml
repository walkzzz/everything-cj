name: Build Multi-Platform

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            sdk_file: cangjie-sdk-linux-x64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
            artifact_name: everything-cj-linux-x64
            cjc_target: ''
            lib_path: 'linux_x86_64_cjnative'

          - os: macos-14
            target: macos-aarch64
            sdk_file: cangjie-sdk-mac-aarch64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225"
            artifact_name: everything-cj-macos-aarch64
            cjc_target: ''
            lib_path: 'darwin_aarch64_cjnative'

          - os: macos-14
            target: macos-x64
            sdk_file: cangjie-sdk-mac-aarch64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225"
            artifact_name: everything-cj-macos-x64
            cjc_target: '--target x86_64-apple-darwin'
            lib_path: 'darwin_aarch64_cjnative'

          - os: ubuntu-22.04
            target: windows-x64
            sdk_file: cangjie-sdk-linux-x64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
            artifact_name: everything-cj-windows-x64.exe
            cjc_target: '--target x86_64-pc-windows-gnu'
            lib_path: 'linux_x86_64_cjnative'

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Cangjie SDK
        run: |
          echo "=== 下载 ${{ matrix.sdk_file }} ==="
          wget --no-check-certificate \
            "${{ matrix.sdk_url }}" \
            -O ${{ matrix.sdk_file }}
          echo "=== 解压 ==="
          tar -zxf ${{ matrix.sdk_file }}

      - name: Setup environment
        run: |
          SDK_DIR="$(pwd)/cangjie"
          echo "CANGJIE_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/tools/bin" >> $GITHUB_PATH

          if [ -d "$SDK_DIR/runtime/lib/${{ matrix.lib_path }}" ]; then
            echo "LD_LIBRARY_PATH=$SDK_DIR/runtime/lib/${{ matrix.lib_path }}:$SDK_DIR/lib/${{ matrix.lib_path }}" >> $GITHUB_ENV
          fi

          if [ -d "$SDK_DIR/runtime/lib/darwin_aarch64_cjnative" ]; then
            echo "DYLD_LIBRARY_PATH=$SDK_DIR/runtime/lib/darwin_aarch64_cjnative:$SDK_DIR/lib/darwin_aarch64_cjnative" >> $GITHUB_ENV
          fi

      - name: Setup macOS SDK
        if: runner.os == 'macOS'
        run: |
          # 找到 macOS SDK 路径并设置 SDKROOT
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo "")
          echo "macOS SDK 路径: $SDK_PATH"
          echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
          # 确保链接器能找到系统库
          echo "LDFLAGS=-L$SDK_PATH/usr/lib" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          cjc --version
          cjpm --version

      - name: Build
        run: |
          echo "=== 构建 ${{ matrix.target }} ==="
          # macOS: 用 -B 指定额外搜索路径
          EXTRA_FLAGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            SYSROOT=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null)
            if [ -n "$SYSROOT" ]; then
              EXTRA_FLAGS="-B $SYSROOT/usr/lib -B $SYSROOT/usr/lib/system"
            fi
          fi

          cjc src/main.cj ${{ matrix.cjc_target }} $EXTRA_FLAGS -s -o ${{ matrix.artifact_name }}

          echo "=== 验证 ==="
          file ${{ matrix.artifact_name }}
          ls -lh ${{ matrix.artifact_name }}

      - name: Test binary
        run: |
          if [ "${{ matrix.target }}" != "windows-x64" ]; then
            chmod +x ${{ matrix.artifact_name }}
            ./${{ matrix.artifact_name }} || true
          fi

      - name: Create tarball
        run: |
          tar -czf everything-cj-v1.0.0-${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}
          if command -v sha256sum &> /dev/null; then
            sha256sum everything-cj-v1.0.0-${{ matrix.target }}.tar.gz > everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 everything-cj-v1.0.0-${{ matrix.target }}.tar.gz > everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-cj-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/everything-cj-*.tar.gz
            artifacts/**/everything-cj-*.sha256
          draft: false
          generate_release_notes: true
          body: |
            ## Everything-CJ v1.0.0

            仓颉版 Everything 搜索工具 - 毫秒级全盘文件定位

            ### 下载
            | 平台 | 文件 | 架构 |
            |------|------|------|
            | Linux | `everything-cj-v1.0.0-linux-x64.tar.gz` | x86_64 |
            | macOS | `everything-cj-v1.0.0-macos-aarch64.tar.gz` | ARM64 (Apple Silicon) |
            | macOS | `everything-cj-v1.0.0-macos-x64.tar.gz` | x86_64 (Intel) |
            | Windows | `everything-cj-v1.0.0-windows-x64.tar.gz` | x86_64 |

            ### 构建环境
            - Cangjie Compiler 1.1.3 (cjnative)
            - GitHub Actions 多平台并行构建
