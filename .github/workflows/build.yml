name: Build Multi-Platform

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            sdk_file: cangjie-sdk-linux-x64-1.1.3.tar.gz
            sdk_url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a1934a821f5a8178d6fd22d
            artifact_name: everything-cj-linux-x64
            cjc_target: ''

          - os: macos-14
            target: macos-aarch64
            sdk_file: cangjie-sdk-mac-aarch64-1.1.3.tar.gz
            sdk_url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225
            artifact_name: everything-cj-macos-aarch64
            cjc_target: ''

          - os: macos-13
            target: macos-x64
            sdk_file: cangjie-sdk-mac-aarch64-1.1.3.tar.gz
            sdk_url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225
            artifact_name: everything-cj-macos-x64
            cjc_target: ''

          - os: ubuntu-22.04
            target: windows-x64
            sdk_file: cangjie-sdk-linux-aarch64-1.1.3.tar.gz
            sdk_url: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-aarch64-1.1.3.tar.gz&objectKey=6a19350321f5a8178d6fd22c
            artifact_name: everything-cj-windows-x64.exe
            cjc_target: '--target x86_64-pc-windows-gnu'

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cangjie SDK
        run: |
          echo "=== 下载仓颉 SDK 1.1.3 ==="
          wget --no-check-certificate \
            "${{ matrix.sdk_url }}" \
            -O ${{ matrix.sdk_file }}

          echo "=== 解压 SDK ==="
          tar -zxf ${{ matrix.sdk_file }}

          echo "=== 配置环境变量 ==="
          SDK_DIR=$(find . -maxdepth 1 -type d -name "cangjie" | head -1)
          echo "CANGJIE_HOME=$(pwd)/$SDK_DIR" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/$SDK_DIR/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/$SDK_DIR/tools/bin" >> $GITHUB_PATH

          # 设置 LD_LIBRARY_PATH (Linux)
          if [ -d "$SDK_DIR/runtime/lib/linux_aarch64_cjnative" ]; then
            echo "LD_LIBRARY_PATH=$(pwd)/$SDK_DIR/runtime/lib/linux_aarch64_cjnative:$(pwd)/$SDK_DIR/lib/linux_aarch64_cjnative:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          fi
          if [ -d "$SDK_DIR/runtime/lib/linux_x86_64_cjnative" ]; then
            echo "LD_LIBRARY_PATH=$(pwd)/$SDK_DIR/runtime/lib/linux_x86_64_cjnative:$(pwd)/$SDK_DIR/lib/linux_x86_64_cjnative:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          fi

          # macOS 设置 DYLD_LIBRARY_PATH
          if [ -d "$SDK_DIR/runtime/lib/darwin_aarch64_cjnative" ]; then
            echo "DYLD_LIBRARY_PATH=$(pwd)/$SDK_DIR/runtime/lib/darwin_aarch64_cjnative:$(pwd)/$SDK_DIR/lib/darwin_aarch64_cjnative" >> $GITHUB_ENV
          fi

      - name: Verify toolchain
        run: |
          cjc --version
          cjpm --version

      - name: Build
        run: |
          echo "=== 构建项目 ==="
          if [ -n "${{ matrix.cjc_target }}" ]; then
            # 交叉编译 (Windows)
            cjc src/main.cj ${{ matrix.cjc_target }} -s -o ${{ matrix.artifact_name }}
          else
            # 原生编译
            cjpm build
            cp target/release/bin/main ${{ matrix.artifact_name }}
          fi

          echo "=== 验证二进制 ==="
          file ${{ matrix.artifact_name }}
          ls -lh ${{ matrix.artifact_name }}

      - name: Test binary
        run: |
          if [ "${{ matrix.target }}" != "windows-x64" ]; then
            ./${{ matrix.artifact_name }} || true
          fi

      - name: Create tarball
        run: |
          tar -czf everything-cj-v1.0.0-${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}
          sha256sum everything-cj-v1.0.0-${{ matrix.target }}.tar.gz > everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-cj-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/everything-cj-*
          draft: false
          generate_release_notes: true
          body: |
            ## Everything-CJ v1.0.0

            仓颉版 Everything 搜索工具 - 毫秒级全盘文件定位

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Linux x64 | `everything-cj-linux-x64.tar.gz` |
            | macOS ARM64 | `everything-cj-macos-aarch64.tar.gz` |
            | macOS x64 | `everything-cj-macos-x64.tar.gz` |
            | Windows x64 | `everything-cj-windows-x64.exe` |

            ### 构建环境
            - Cangjie Compiler 1.1.3 (cjnative)
            - GitHub Actions 多平台构建
