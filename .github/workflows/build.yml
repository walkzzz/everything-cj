name: Build Multi-Platform

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            sdk_file: cangjie-sdk-linux-x64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
            artifact_name: everything-cj-linux-x64
            cjc_target: ''
            lib_path: 'linux_x86_64_cjnative'

          - os: macos-14
            target: macos-aarch64
            sdk_file: cangjie-sdk-mac-aarch64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.1.3.tar.gz&objectKey=6a19312721f5a8178d6fd225"
            artifact_name: everything-cj-macos-aarch64
            cjc_target: ''
            lib_path: 'darwin_aarch64_cjnative'

          - os: ubuntu-22.04
            target: windows-x64
            sdk_file: cangjie-sdk-linux-x64-1.1.3.tar.gz
            sdk_url: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.3.tar.gz&objectKey=6a19349d21f5a8178d6fd22b"
            artifact_name: everything-cj-windows-x64.exe
            cjc_target: '--target x86_64-pc-windows-gnu'
            lib_path: 'linux_x86_64_cjnative'

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Cangjie SDK
        run: |
          wget --no-check-certificate \
            "${{ matrix.sdk_url }}" \
            -O ${{ matrix.sdk_file }}
          tar -zxf ${{ matrix.sdk_file }}

      - name: Setup environment
        run: |
          SDK_DIR="$(pwd)/cangjie"
          echo "CANGJIE_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/tools/bin" >> $GITHUB_PATH
          if [ -d "$SDK_DIR/runtime/lib/${{ matrix.lib_path }}" ]; then
            echo "LD_LIBRARY_PATH=$SDK_DIR/runtime/lib/${{ matrix.lib_path }}:$SDK_DIR/lib/${{ matrix.lib_path }}" >> $GITHUB_ENV
          fi
          if [ -d "$SDK_DIR/runtime/lib/darwin_aarch64_cjnative" ]; then
            echo "DYLD_LIBRARY_PATH=$SDK_DIR/runtime/lib/darwin_aarch64_cjnative:$SDK_DIR/lib/darwin_aarch64_cjnative" >> $GITHUB_ENV
          fi

      - name: Setup macOS SDK
        if: runner.os == 'macOS'
        run: |
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo "")
          echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          cjc --version
          cjpm --version

      - name: Build
        run: |
          EXTRA_FLAGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            SYSROOT=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null)
            if [ -n "$SYSROOT" ]; then
              EXTRA_FLAGS="-B $SYSROOT/usr/lib -B $SYSROOT/usr/lib/system"
            fi
          fi
          # Windows 交叉编译用 --static-std --static-libs 减少DLL依赖
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --static-std --static-libs"
          fi
          cjc src/main.cj ${{ matrix.cjc_target }} $EXTRA_FLAGS -s -o ${{ matrix.artifact_name }}
          file ${{ matrix.artifact_name }}
          ls -lh ${{ matrix.artifact_name }}

      - name: Test binary
        run: |
          if [ "${{ matrix.target }}" != "windows-x64" ]; then
            chmod +x ${{ matrix.artifact_name }}
            ./${{ matrix.artifact_name }} || true
          fi

      # ── Windows: 打包 exe + 运行时 DLL 到 zip ──
      - name: Package Windows (exe + DLLs)
        if: matrix.target == 'windows-x64'
        run: |
          echo "=== 打包 Windows 分发包 (exe + 运行时 DLL) ==="
          SDK_DIR="$(pwd)/cangjie"
          DLL_DIR="$SDK_DIR/runtime/lib/windows_x86_64_cjnative"

          mkdir -p win_package
          cp ${{ matrix.artifact_name }} win_package/everything-cj.exe
          cp "$DLL_DIR/libcangjie-runtime.dll" win_package/
          cp "$DLL_DIR/libboundscheck.dll" win_package/

          echo "=== 包内容 ==="
          ls -lh win_package/

          # 创建 zip
          cd win_package
          zip -r ../everything-cj-v1.0.0-windows-x64.zip .
          cd ..

          echo "=== zip 大小 ==="
          ls -lh everything-cj-v1.0.0-windows-x64.zip

          # SHA256
          sha256sum everything-cj-v1.0.0-windows-x64.zip > everything-cj-v1.0.0-windows-x64.zip.sha256

          # 同时保留单独的 exe（供想自己配DLL的用户）
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      # ── macOS: 创建 .dmg ──
      - name: Create macOS .dmg
        if: runner.os == 'macOS'
        run: |
          echo "=== 创建 DMG ==="
          mkdir -p dmg_content
          cp ${{ matrix.artifact_name }} dmg_content/
          ln -s /Applications dmg_content/Applications

          DMG_NAME=everything-cj-v1.0.0-${{ matrix.target }}.dmg
          hdiutil create \
            -volname "Everything-CJ" \
            -srcfolder dmg_content \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          echo "=== 验证 DMG ==="
          ls -lh "$DMG_NAME"
          hdiutil verify "$DMG_NAME"
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: Create tarball
        run: |
          tar -czf everything-cj-v1.0.0-${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}
          if command -v sha256sum &> /dev/null; then
            sha256sum everything-cj-v1.0.0-${{ matrix.target }}.tar.gz > everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 everything-cj-v1.0.0-${{ matrix.target }}.tar.gz > everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-cj-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz
            everything-cj-v1.0.0-${{ matrix.target }}.tar.gz.sha256
            everything-cj-v1.0.0-${{ matrix.target }}.dmg
            everything-cj-v1.0.0-${{ matrix.target }}.dmg.sha256
            everything-cj-v1.0.0-windows-x64.zip
            everything-cj-v1.0.0-windows-x64.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/everything-cj-*.tar.gz
            artifacts/**/everything-cj-*.tar.gz.sha256
            artifacts/**/everything-cj-windows-x64.exe
            artifacts/**/everything-cj-windows-x64.exe.sha256
            artifacts/**/everything-cj-v1.0.0-windows-x64.zip
            artifacts/**/everything-cj-v1.0.0-windows-x64.zip.sha256
            artifacts/**/everything-cj-*.dmg
            artifacts/**/everything-cj-*.dmg.sha256
          draft: false
          generate_release_notes: true
          body: |
            ## Everything-CJ v1.0.0

            仓颉版 Everything 搜索工具 - 毫秒级全盘文件定位

            ### 下载
            | 平台 | 文件 | 架构 | 说明 |
            |------|------|------|------|
            | Linux | `everything-cj-v1.0.0-linux-x64.tar.gz` | x86_64 | 解压后运行 |
            | macOS | `everything-cj-v1.0.0-macos-aarch64.dmg` | ARM64 | 双击安装，拖入 Applications |
            | **Windows** | `everything-cj-v1.0.0-windows-x64.zip` | x86_64 | **解压后双击 everything-cj.exe 运行** |
            | Windows (仅exe) | `everything-cj-windows-x64.exe` | x86_64 | 需自行配置运行时 DLL |

            ### Windows 用户注意
            **请下载 `.zip` 包**，解压后双击 `everything-cj.exe` 即可运行。
            zip 包内已包含运行时 DLL（libcangjie-runtime.dll、libboundscheck.dll）。
            单独的 `.exe` 文件需要自行配置 Cangjie 运行时环境。

            ### 构建环境
            - Cangjie Compiler 1.1.3 (cjnative)
            - GitHub Actions 多平台并行构建
